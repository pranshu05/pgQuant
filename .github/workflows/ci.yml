name: CI

on:
    push:
        branches: ["main"]
    pull_request:
        branches: ["main"]

jobs:
    test:
        runs-on: ubuntu-latest
        strategy:
            matrix:
                pg-version: [15, 16, 17]
        steps:
            - uses: actions/checkout@v4
            - name: Install Rust
              uses: dtolnay/rust-toolchain@stable
            - name: Install pgrx dependencies
              run: |
                  sudo apt-get update
                  sudo apt-get install -y libclang-dev build-essential libreadline-dev zlib1g-dev flex bison libssl-dev pkg-config
            - name: Install cargo-pgrx
              run: cargo install cargo-pgrx --version "=0.12.9" --locked
            - name: Initialize pgrx
              run: cargo pgrx init --pg${{ matrix.pg-version }} download
            - name: Test
              run: cargo pgrx test pg${{ matrix.pg-version }}
