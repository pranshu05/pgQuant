name: CI

on:
    push:
        branches: ["main"]
    pull_request:
        branches: ["main"]

jobs:
    test:
        runs-on: ubuntu-latest
        strategy:
            matrix:
                pg-version: [15, 16, 17]
        steps:
            - uses: actions/checkout@v4
            - name: Install Rust
              uses: dtolnay/rust-toolchain@stable
            - uses: Swatinem/rust-cache@v2
              with:
                key: pg${{ matrix.pg-version }}
            - name: Cache pgrx and cargo-pgrx
              id: pgrx-cache
              uses: actions/cache@v4
              with:
                  path: |
                      ~/.cargo/bin/cargo-pgrx
                      ~/.pgrx/config.toml
                      ~/.pgrx/${{ matrix.pg-version }}*
                  key: ${{ runner.os }}-pgrx-0.12.9-${{ matrix.pg-version }}-v2
            - name: Install pgrx dependencies
              run: |
                  sudo apt-get update
                  sudo apt-get install -y libclang-dev build-essential libreadline-dev zlib1g-dev flex bison libssl-dev pkg-config
            - name: Install cargo-pgrx
              run: |
                  if ! command -v cargo-pgrx &> /dev/null; then
                    cargo install cargo-pgrx --version "=0.12.9" --locked
                  fi
            - name: Initialize pgrx
              run: |
                  if [ ! -f "$HOME/.pgrx/config.toml" ] || ! grep -q "pg${{ matrix.pg-version }}" "$HOME/.pgrx/config.toml"; then
                    cargo pgrx init --pg${{ matrix.pg-version }} download
                  fi
            - name: Test
              run: |
                  rm -rf ~/.pgrx/data-*
                  cargo pgrx test pg${{ matrix.pg-version }}
                  rm -rf ~/.pgrx/data-*
