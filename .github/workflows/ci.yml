name: CI

on:
    push:
        branches: ["main"]
    pull_request:
        branches: ["main"]

jobs:
    test:
        runs-on: ubuntu-22.04
        strategy:
            matrix:
                pg-version: [15, 16, 17]
        steps:
            - uses: actions/checkout@v4
            - name: Install Rust
              uses: dtolnay/rust-toolchain@stable
            - uses: Swatinem/rust-cache@v2
              with:
                key: pg${{ matrix.pg-version }}
            - name: Cache pgrx and cargo-pgrx
              id: pgrx-cache
              uses: actions/cache@v4
              with:
                  path: |
                      ~/.cargo/bin/cargo-pgrx
                      ~/.pgrx
                  key: ${{ runner.os }}-22.04-pgrx-0.12.9-${{ matrix.pg-version }}
            - name: Install pgrx dependencies
              run: |
                  sudo apt-get update
                  sudo apt-get install -y libclang-dev build-essential libreadline-dev zlib1g-dev flex bison libssl-dev pkg-config
            - name: Install cargo-pgrx
              if: steps.pgrx-cache.outputs.cache-hit != 'true'
              run: cargo install cargo-pgrx --version "=0.12.9" --locked --force
            - name: Initialize pgrx
              if: steps.pgrx-cache.outputs.cache-hit != 'true'
              run: cargo pgrx init --pg${{ matrix.pg-version }} download
            - name: Clean test cluster and stale pid files
              run: |
                  rm -rf target/test-pgdata ~/.pgrx/data-* /tmp/pgrx-test-data
            - name: Test
              env:
                  CARGO_PGRX_TEST_PGDATA: /tmp/pgrx-test-data
              run: cargo pgrx test pg${{ matrix.pg-version }}
